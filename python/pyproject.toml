[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "verbo"
version = "0.1.0"
description = "Inferencia local de LLM en C++ con bindings de Python"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=8", "numpy"]

[project.scripts]
verbo-py = "verbo.__main__:main"

[tool.scikit-build]
cmake.source-dir = ".."
wheel.packages = ["verbo"]
cmake.define.VERBO_TESTS = "OFF"
cmake.define.VERBO_NATIVE = "ON"
cmake.define.VERBO_PYTHON = "ON"
